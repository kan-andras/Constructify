    <section class="contact">
        <h1 id="cim">Lépj kapcsolatba velünk!</h1>
        <h3 id="szoveg">Kérjük add meg az adataidat és írd meg az üzeneted!</h3>
        <div class="parent">
            <div class="div1"><input class="inputfield" id="nevinput" type="email" 
            placeholder="Név"> </div>
            <div class="div2"><input class="inputfield" id="phoneinput" type="email"
            placeholder="Telefonszám"> </div>
            <div class="div3"><input class="inputfield" id="emailinput" type="email"
            placeholder="Email"> </div>
            <div class="div4"><input class="inputfield" id="lakciminput" type="email"
            placeholder="Lakcím pl.:Budapest 1054 Szabadság tér 17."> </div>
            </div>
        <textarea id="uzenetinput" placeholder="Üzenet" rows="5" maxlength="800"></textarea>
        <div id="uzenetHelper" class="uzenet-helper">
            <span class="helper-text">Kérjük, írj egy részletes üzenetet (kérdés, megjegyzés, vagy visszajelzés)</span>
            <span class="helper-counter"><span id="charCount">0</span>/800</span>
        </div>
        <button id="uzKuldGomb" onclick="uzenetKuldes()">Üzenet <br> elküldése</button>
    </section>
